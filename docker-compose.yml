services:
  quittungsbot:
    image: ghcr.io/stefan-ffr/quittungsabrechnungsbot:latest
    # build: .  # Für lokales Bauen auskommentieren
    container_name: quittungsbot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ALLOWED_CHAT_IDS=${ALLOWED_CHAT_IDS}
      - DATABASE_PATH=/data/receipts.db
      - UPLOAD_PATH=/data/uploads
    volumes:
      - quittungsbot_data:/data

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 quittungsbot

volumes:
  quittungsbot_data:
